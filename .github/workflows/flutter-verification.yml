name: Flutter verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
          pub-cache: true

      - name: Prepare diagnostic logs
        run: mkdir -p logs

      - name: Show toolchain versions
        shell: bash
        run: |
          set -o pipefail
          {
            flutter --version
            dart --version
            java -version
          } 2>&1 | tee logs/toolchain.log

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee logs/flutter-pub-get.log

      - name: Verify dependency files stayed locked
        shell: bash
        run: |
          set -o pipefail
          git diff --exit-code -- pubspec.yaml pubspec.lock .metadata \
            2>&1 | tee logs/dependency-integrity.log

      - name: Verify Dart formatting
        shell: bash
        run: |
          set -o pipefail
          dart format --set-exit-if-changed . 2>&1 | tee logs/dart-format.log

      - name: Analyze project
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee logs/flutter-analyze.log

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee logs/flutter-test.log

      - name: Upload diagnostic logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-verification-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 7
